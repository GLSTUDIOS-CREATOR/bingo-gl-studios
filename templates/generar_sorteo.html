<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Generador de Sorteos | GL Studios</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700&display=swap" rel="stylesheet">
  <style>
    body { margin:0; background:#f5f7fb; font-family:'Montserrat', sans-serif; color:#222; }
    .container { max-width:1100px; margin:40px auto; background:#fff; border-radius:18px; box-shadow:0 4px 25px rgba(0,0,0,0.1); padding:30px; }
    .header { display:flex; align-items:center; justify-content:space-between; margin-bottom:25px; }
    .header img { height:60px; }
    h1 { color:#0d47a1; margin:0; font-size:1.8em; }
    .btn-crear { background:#43a047; color:#fff; padding:12px 25px; border:none; border-radius:8px; font-weight:bold; cursor:pointer; transition:0.2s; }
    .btn-crear:hover { background:#388e3c; }
    table { width:100%; border-collapse:collapse; margin-top:20px; }
    th, td { text-align:left; padding:14px 12px; border-bottom:1px solid #ccc; }
    th { background:#0d47a1; color:white; }
    .btn-ver { color:#1565c0; text-decoration:none; font-weight:bold; cursor:pointer; }
    .modal { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); justify-content:center; align-items:center; z-index:999; }
    .modal-content { background:white; padding:30px; border-radius:14px; max-width:800px; width:90%; max-height:90%; overflow-y:auto; box-shadow:0 6px 30px rgba(0,0,0,0.2); }
    .modal-header { display:flex; justify-content:space-between; align-items:center; border-bottom:2px solid #0d47a1; margin-bottom:20px; }
    .modal-header h2 { margin:0; color:#0d47a1; }
    .close { font-size:28px; font-weight:bold; color:#e53935; cursor:pointer; }
    .form-group { margin-bottom:18px; }
    .form-group label { display:block; margin-bottom:6px; font-weight:500; }
    .form-group input, .form-group select { width:100%; padding:10px; border:1px solid #ccc; border-radius:6px; font-size:1em; }
    .btn-submit { background:#0d47a1; color:#fff; padding:12px 25px; border:none; border-radius:8px; font-weight:bold; cursor:pointer; transition:0.2s; }
    .btn-submit:hover { background:#08306b; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div style="display:flex; align-items:center;">
        <img src="/static/img/logo.png" alt="GL Studios Logo">
        <h1 style="margin-left:15px;">Lista de Sorteos</h1>
      </div>
      <button class="btn-crear" onclick="abrirModalCrear()">+ Crear Nuevo Sorteo</button>
    </div>
    <table>
      <thead>
        <tr><th>ID</th><th>Fecha</th><th>Identificador</th><th>Acciones</th></tr>
      </thead>
      <tbody>
        <tr>
          <td>1</td>
          <td>2025-06-27</td>
          <td>AC-123</td>
          <td><span class="btn-ver" onclick="abrirModalDetalles()">Ver detalles</span></td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- MODAL CREAR -->
  <div class="modal" id="modalCrear">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Crear Nuevo Sorteo</h2>
        <span class="close" onclick="cerrarModalCrear()">&times;</span>
      </div>
      <form id="crearSorteoForm">
        <div class="form-group">
          <label>Fecha del Sorteo:</label>
          <input type="date" required>
        </div>
        <div class="form-group">
          <label>Identificador del Sorteo:</label>
          <input type="text" placeholder="Ej: AC-123" required>
        </div>
        <div class="form-group">
          <label>Serie de Boletos:</label>
          <select required>
            <option value="">Seleccione...</option>
            <option value="A">Serie A</option>
            <option value="B">Serie B</option>
          </select>
        </div>
        <div class="form-group">
          <label>Planilla Máx. Boletos:</label>
          <input type="number" placeholder="15000" required>
        </div>
        <button type="submit" class="btn-submit">Guardar Sorteo</button>
      </form>
    </div>
  </div>

  <!-- MODAL DETALLES -->
  <div class="modal" id="modalDetalles">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Detalles del Sorteo - AC-123</h2>
        <span class="close" onclick="cerrarModalDetalles()">&times;</span>
      </div>
      <p>Aquí irán los detalles completos del sorteo seleccionado.</p>
    </div>
  </div>

<script>
function abrirModalCrear() { document.getElementById('modalCrear').style.display='flex'; }
function cerrarModalCrear() { document.getElementById('modalCrear').style.display='none'; }
function abrirModalDetalles() { document.getElementById('modalDetalles').style.display='flex'; }
function cerrarModalDetalles() { document.getElementById('modalDetalles').style.display='none'; }
</script>
</body>
</html>
