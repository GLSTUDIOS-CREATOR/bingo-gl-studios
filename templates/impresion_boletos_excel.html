<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Impresión de Boletos y Planillas</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --color-primary:    #1A73E8;
      --color-secondary:  #F1F3F4;
      --color-text:       #202124;
      --color-bg:         #FFFFFF;
      --color-border:     #E0E0E0;
      --color-success:    #28A745;
      --radius:           8px;
      --shadow-light:     0 2px 8px rgba(0,0,0,0.1);
      --font-main:        'Montserrat', sans-serif;
      --transition-fast:  0.2s ease-in-out;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font-main);
      background: var(--color-secondary);
      color: var(--color-text);
      line-height: 1.5;
    }

    /* HEADER CORPORATIVO */
    header {
      background: var(--color-primary);
      color: white;
      padding: 12px 24px;
      display: flex;
      align-items: center;
      box-shadow: var(--shadow-light);
    }
    header img {
      height: 48px;
      margin-right: 16px;
    }
    header h1 {
      font-size: 1.5rem;
      font-weight: 600;
    }

    main {
      max-width: 1100px;
      margin: 32px auto;
      padding: 0 16px;
    }

    .panels {
      display: flex;
      gap: 32px;
      flex-wrap: wrap;
      justify-content: space-between;
    }
    .panel {
      background: var(--color-bg);
      border: 1px solid var(--color-border);
      border-radius: var(--radius);
      box-shadow: var(--shadow-light);
      flex: 1 1 380px;
      max-width: 480px;
      padding: 24px;
      transition: transform var(--transition-fast);
    }
    .panel:hover {
      transform: translateY(-4px);
    }
    .panel h2 {
      font-size: 1.25rem;
      font-weight: 600;
      margin-bottom: 20px;
      color: var(--color-primary);
      border-left: 4px solid var(--color-primary);
      padding-left: 12px;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }
    .col {
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    label {
      font-weight: 600;
      margin-bottom: 6px;
    }
    input,
    select {
      padding: 10px;
      border: 1px solid var(--color-border);
      border-radius: var(--radius);
      font-size: 1rem;
      transition: border-color var(--transition-fast);
    }
    input:focus,
    select:focus {
      border-color: var(--color-primary);
      outline: none;
    }
    .checkbox {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn {
      padding: 12px;
      font-size: 1rem;
      font-weight: 600;
      border: none;
      border-radius: var(--radius);
      cursor: pointer;
      transition: background var(--transition-fast), transform var(--transition-fast);
    }
    .btn.primary {
      background: var(--color-primary);
      color: white;
    }
    .btn.primary:hover {
      background: darken(var(--color-primary), 10%);
      transform: translateY(-2px);
    }
    .btn.success {
      background: var(--color-success);
      color: white;
    }
    .btn.success:hover {
      background: darken(var(--color-success), 10%);
      transform: translateY(-2px);
    }

    .preview {
      text-align: center;
      margin-top: 12px;
    }
    .preview img {
      width: 80px;
      height: 80px;
      object-fit: contain;
      border-radius: var(--radius);
      display: none;
      margin-bottom: 8px;
    }
    .preview p {
      font-size: 0.9rem;
      color: #5f6368;
    }

    @media (max-width: 800px) {
      .panels {
        flex-direction: column;
        gap: 24px;
      }
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header>
    <img src="{{ url_for('static', filename='golpe_suerte_logo.png') }}" alt="Logo GL Studios">
    <h1>Impresión de Boletos y Planillas</h1>
  </header>

  <main>
    <div class="panels">

      <!-- PANEL DE BOLETOS -->
      <section class="panel" aria-labelledby="boletos-title">
        <h2 id="boletos-title">🎫 Boletos de Bingo</h2>
        <form method="post">
          <input type="hidden" name="form_type" value="boletos">

          <div class="row">
            <div class="col">
              <label for="serie_archivo">Serie archivo</label>
              <select id="serie_archivo" name="serie_archivo" required>
                {% for s in series %}<option>{{s}}</option>{% endfor %}
              </select>
            </div>
            <div class="col">
              <label for="serie_inicio">Inicio</label>
              <input id="serie_inicio" name="serie_inicio" type="text" placeholder="1">
            </div>
            <div class="col">
              <label for="serie_fin">Fin</label>
              <input id="serie_fin" name="serie_fin" type="text" placeholder="10">
            </div>
          </div>

          <div class="row">
            <div class="col">
              <label for="valor">Valor boleto</label>
              <input id="valor" name="valor" type="text" value="1">
            </div>
            <div class="col">
              <label for="telefono">Teléfono</label>
              <input id="telefono" name="telefono" type="text" value="0993239962">
            </div>
          </div>

          <div class="col">
            <label for="fecha_sorteo">Fecha sorteo</label>
            <input id="fecha_sorteo" name="fecha_sorteo" type="date" value="{{fecha_hoy}}">
          </div>

          <div class="row">
            <div class="col">
              <label for="reintegro_especial">Reintegro</label>
              <select id="reintegro_especial" name="reintegro_especial">
                <option value="">(ninguno)</option>
                {% for r in reintegros %}<option>{{r}}</option>{% endfor %}
              </select>
            </div>
            <div class="col">
              <label for="cant_reintegro_especial">Cantidad</label>
              <input id="cant_reintegro_especial" name="cant_reintegro_especial" type="number" min="0" value="0">
            </div>
          </div>

          <div class="checkbox">
            <input type="checkbox" id="incluir_aleatorio" name="incluir_aleatorio" value="1" checked>
            <label for="incluir_aleatorio">Llenar el resto aleatorio</label>
          </div>

          <button class="btn primary" type="submit">Generar PDF de Boletos</button>

          <div class="preview">
            <img id="preview-img" src="" alt="Vista previa de reintegro">
            <p id="preview-file">Selecciona un reintegro</p>
          </div>
        </form>
      </section>

      <!-- PANEL DE PLANILLA -->
      <section class="panel" aria-labelledby="planilla-title">
        <h2 id="planilla-title">📄 Planilla para Vendedor</h2>
        <form method="post">
          <input type="hidden" name="form_type" value="planilla">

          <div class="row">
            <div class="col">
              <label for="serie_archivo_planilla">Serie archivo</label>
              <select id="serie_archivo_planilla" name="serie_archivo_planilla" required>
                {% for s in series %}<option>{{s}}</option>{% endfor %}
              </select>
            </div>
            <div class="col">
              <label for="planilla_inicio">Inicio</label>
              <input id="planilla_inicio" name="planilla_inicio" type="number" min="1" value="1">
            </div>
            <div class="col">
              <label for="planilla_fin">Fin</label>
              <input id="planilla_fin" name="planilla_fin" type="number" min="1" value="40">
            </div>
          </div>

          <div class="col">
            <label for="nombre_vendedor">Vendedor</label>
            <input id="nombre_vendedor" name="nombre_vendedor" type="text" placeholder="Nombre vendedor">
          </div>

          <div class="col">
            <label for="fecha_planilla">Fecha impresión</label>
            <input id="fecha_planilla" name="fecha_planilla" type="date" value="{{fecha_hoy}}">
          </div>

          <button class="btn success" type="submit">Imprimir Planilla</button>
        </form>
      </section>

    </div>
  </main>

  <script>
    (function(){
      const path = "/data/REINTEGROS/";
      const sel  = document.getElementById('reintegro_especial');
      const img  = document.getElementById('preview-img');
      const txt  = document.getElementById('preview-file');
      function update() {
        if (sel.value) {
          img.src = path + sel.value;
          img.style.display = 'block';
          txt.textContent = sel.value.replace('.png','').replace(/_/g,' ').toUpperCase();
        } else {
          img.style.display = 'none';
          txt.textContent = 'Selecciona un reintegro';
        }
      }
      sel.addEventListener('change', update);
      window.addEventListener('DOMContentLoaded', update);
    })();
  </script>
</body>
</html>
