<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Editor de Boletos</title>
  <script src="https://cdn.jsdelivr.net/npm/interactjs/dist/interact.min.js"></script>
  <style>
    body { font-family: sans-serif; margin: 20px; }
    h1 { margin-bottom: 10px; }
    #editor {
      position: relative;
      width: 595px;    /* Ancho A4 en puntos */
      height: 842px;   /* Alto A4 */
      border: 1px solid #ccc;
      background: #fff;
      background-image: url("{{ url_for('static', filename='template_boleto.png') }}");
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center center;
      margin-bottom: 10px;
      overflow: hidden;
    }
    .item {
      position: absolute;
      touch-action: none;
      user-select: none;
      cursor: move;
      background: rgba(255,255,255,0.7);
      padding: 2px 4px;
      border: 1px dashed #999;
      transform-origin: top left;
    }
    .item img { display: block; max-width: 100%; height: auto; }
    #save-btn {
      padding: 8px 16px;
      font-size: 14px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>Editor de Boletos</h1>
  <div id="editor">
    {% for key, label in {'numero':'123','serie':'1V | 2025-06-28','valor':'$1','telefono':'Tel: 0993239962'}.items() %}
      <div class="item" data-key="{{ key }}" id="item-{{ key }}">{{ label }}</div>
    {% endfor %}
    <div class="item" data-key="qr" id="item-qr"><img src="{{ url_for('static', filename='placeholder_qr.png') }}" alt="QR"></div>
    <div class="item" data-key="reintegro" id="item-reintegro"><img src="{{ url_for('static', filename='placeholder_reintegro.png') }}" alt="Reintegro"></div>
  </div>
  <button id="save-btn">Guardar Posiciones</button>

  <script>
  const items = Array.from(document.querySelectorAll('.item'));

  // Fetch posiciones desde ruta específica
  fetch('{{ url_for('serve_posiciones') }}')
    .then(res => res.json())
    .then(cfg => {
      items.forEach(el => {
        const key = el.dataset.key;
        if (cfg[key]) {
          el.dataset.x = cfg[key].x;
          el.dataset.y = cfg[key].y;
          el.dataset.angle = cfg[key].angle;
          el.style.transform = `translate(${cfg[key].x}px, ${cfg[key].y}px) rotate(${cfg[key].angle}deg)`;
        } else {
          el.dataset.x = 0;
          el.dataset.y = 0;
          el.dataset.angle = 0;
          el.style.transform = `translate(0px, 0px) rotate(0deg)`;
        }
      });
    });

  items.forEach(el => {
    interact(el).draggable({ listeners: { move(event) {
      const dx = (parseFloat(el.dataset.x)||0) + event.dx;
      const dy = (parseFloat(el.dataset.y)||0) + event.dy;
      el.dataset.x = dx; el.dataset.y = dy;
      const ang = parseFloat(el.dataset.angle)||0;
      el.style.transform = `translate(${dx}px, ${dy}px) rotate(${ang}deg)`;
    }}});

    el.addEventListener('wheel', event => {
      event.preventDefault();
      const delta = event.deltaY * -0.1;
      const ang = (parseFloat(el.dataset.angle)||0) + delta;
      el.dataset.angle = ang;
      const dx = parseFloat(el.dataset.x)||0;
      const dy = parseFloat(el.dataset.y)||0;
      el.style.transform = `translate(${dx}px, ${dy}px) rotate(${ang}deg)`;
    });
  });

  document.getElementById('save-btn').addEventListener('click', () => {
    const data = {};
    items.forEach(el => {
      data[el.dataset.key] = {
        x: parseFloat(el.dataset.x)||0,
        y: parseFloat(el.dataset.y)||0,
        angle: parseFloat(el.dataset.angle)||0
      };
    });
    fetch('{{ url_for('editor_boletos') }}', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data)
    }).then(res => res.json()).then(json => alert(json.msg));
  });
  </script>
</body>
</html>
