<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Impresión de Boletos y Planillas</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;500;400&display=swap" rel="stylesheet">
    <style>
        body {
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(115deg, #e3f0ff 60%, #b2ccff 100%);
            font-family: 'Montserrat', Arial, sans-serif;
        }
        .main-container {
            max-width: 1100px;
            margin: 56px auto 0 auto;
            background: rgba(255,255,255,0.98);
            border-radius: 36px;
            box-shadow: 0 8px 44px #2156a128, 0 2px 16px #bdd8fc22;
            padding: 48px 38px 34px 38px;
        }
        .config-bar {
            background: #f6faff;
            border-radius: 18px;
            box-shadow: 0 1px 8px #bdd8fc33;
            padding: 12px 36px;
            margin-bottom: 32px;
            display: flex;
            justify-content: flex-end;
            gap: 24px;
            align-items: center;
        }
        .config-bar label {
            font-size: 1em;
            color: #2573d0;
            font-weight: 600;
            margin-right: 5px;
        }
        .config-bar select {
            padding: 5px 12px;
            border-radius: 7px;
            background: #ecf3ff;
            border: 1.2px solid #9db5e7;
            font-family: inherit;
            font-weight: 600;
            color: #2156a1;
        }
        .panels-flex {
            display: flex;
            gap: 36px;
            flex-wrap: wrap;
            justify-content: space-between;
        }
        .panel {
            background: linear-gradient(104deg, #f6faff 85%, #ecf3ff 100%);
            border-radius: 23px;
            padding: 34px 30px 22px 30px;
            box-shadow: 0 2px 12px #bad6ff33;
            flex: 1 1 390px;
            min-width: 340px;
            max-width: 490px;
            display: flex;
            flex-direction: column;
            margin-bottom: 14px;
        }
        .panel-title {
            color: #2156a1;
            font-size: 1.23em;
            font-weight: 900;
            margin-bottom: 16px;
            letter-spacing: 0.6px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        form {
            width: 100%;
        }
        .form-row {
            display: flex;
            gap: 12px;
            margin-bottom: 13px;
        }
        .form-col {
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        label {
            font-size: .99em;
            font-weight: 600;
            color: #2156a1;
            margin-bottom: 4px;
        }
        input[type="text"], input[type="number"], input[type="date"], select {
            width: 100%;
            font-size: 1.05em;
            border: 1.5px solid #a6c6e6;
            border-radius: 7px;
            padding: 9px 10px;
            background: #f9fbff;
            font-family: inherit;
            box-sizing: border-box;
            margin-bottom: 2px;
            font-weight: 600;
            color: #314879;
            transition: border .18s;
        }
        input:focus, select:focus {
            border-color: #3787eb;
            outline: none;
        }
        .checkbox-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 9px 0 15px 0;
        }
        .btn {
            width: 100%;
            border: none;
            border-radius: 10px;
            padding: 14px 0;
            font-size: 1.15em;
            font-weight: 800;
            background: linear-gradient(92deg, #2573d0 70%, #51b9fa 100%);
            color: #fff;
            margin-top: 18px;
            margin-bottom: 10px;
            box-shadow: 0 4px 18px #3076e644;
            cursor: pointer;
            letter-spacing: 1px;
            transition: background .13s, transform .11s;
        }
        .btn:hover {
            background: linear-gradient(92deg, #205bb1 65%, #67cfff 100%);
            transform: scale(1.03);
        }
        .btn.green {
            background: linear-gradient(92deg, #13bc69 78%, #44f7bb 100%);
            color: #fff;
            margin-top: 14px;
        }
        .btn.green:hover {
            background: linear-gradient(92deg, #0d9351 60%, #81ffd1 100%);
        }
        .preview-title {
            color: #2156a1;
            font-size: 1.08em;
            font-weight: 700;
            text-align: center;
            margin: 24px 0 10px 0;
            letter-spacing: 0.5px;
        }
        #preview-img {
            width: 90px;
            height: 90px;
            object-fit: contain;
            margin: 0 auto 7px auto;
            background: #e6ecfa;
            border-radius: 10px;
            box-shadow: 0 1px 7px #b9cdf3;
            display: none;
        }
        #preview-file {
            color: #4c6078;
            font-size: 1em;
            text-align: center;
            letter-spacing: 0.4px;
        }
        .preview-note {
            color: #8393b7;
            font-size: 0.97em;
            text-align: center;
            margin-top: 7px;
        }
        @media (max-width: 980px) {
            .main-container {padding: 8px;}
            .panels-flex {flex-direction: column; gap:18px;}
            .panel {max-width:100%; margin-bottom:16px;}
        }
        @media (max-width: 600px) {
            .main-container {padding: 1px;}
            .config-bar {padding: 6px 3vw; flex-wrap: wrap;}
            .panel {padding: 16px 5vw;}
        }
    </style>
</head>
<body>
<div class="main-container">

    <!-- Configuración de posiciones -->
    <div class="config-bar">
        <label>Logo:</label>
        <select name="pos_logo">
            <option value="top_left">Arriba Izquierda</option>
            <option value="top_right">Arriba Derecha</option>
            <option value="bottom_left">Abajo Izquierda</option>
            <option value="bottom_right">Abajo Derecha</option>
        </select>
        <label>Fecha:</label>
        <select name="pos_fecha">
            <option value="top_left">Arriba Izquierda</option>
            <option value="top_right">Arriba Derecha</option>
            <option value="bottom_left">Abajo Izquierda</option>
            <option value="bottom_right">Abajo Derecha</option>
        </select>
        <label>Vendedor:</label>
        <select name="pos_vendedor">
            <option value="top_left">Arriba Izquierda</option>
            <option value="top_right">Arriba Derecha</option>
            <option value="bottom_left">Abajo Izquierda</option>
            <option value="bottom_right">Abajo Derecha</option>
        </select>
        <label>QR:</label>
        <select name="pos_qr">
            <option value="top_left">Arriba Izquierda</option>
            <option value="top_right">Arriba Derecha</option>
            <option value="bottom_left">Abajo Izquierda</option>
            <option value="bottom_right">Abajo Derecha</option>
        </select>
    </div>

    <div class="panels-flex">
        <!-- Boletos -->
        <div class="panel">
            <div class="panel-title">🎫 Impresión de Boletos de Bingo</div>
            <form method="post">
                <input type="hidden" name="form_type" value="boletos">
                <div class="form-row">
                    <div class="form-col" style="flex:2">
                        <label>Serie archivo:</label>
                        <select name="serie_archivo" required>
                            {% for s in series %}
                                <option>{{s}}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="form-col">
                        <label>Inicio:</label>
                        <input type="text" name="serie_inicio" placeholder="1"/>
                    </div>
                    <div class="form-col">
                        <label>Fin:</label>
                        <input type="text" name="serie_fin" placeholder="10"/>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-col">
                        <label>Valor boleto:</label>
                        <input type="text" name="valor" value="1" required/>
                    </div>
                    <div class="form-col">
                        <label>Teléfono:</label>
                        <input type="text" name="telefono" value="0993239962" required/>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-col">
                        <label>Fecha sorteo:</label>
                        <input type="date" name="fecha_sorteo" required value="{{fecha_hoy if fecha_hoy else ''}}"/>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-col" style="flex:1.7;">
                        <label>Reintegro:</label>
                        <select name="reintegro_especial" id="reintegro_especial">
                            <option value="">(ninguno)</option>
                            {% for r in reintegros %}
                                <option>{{r}}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="form-col">
                        <label>Cantidad:</label>
                        <input type="number" min="0" max="999" name="cant_reintegro_especial" value="0"/>
                    </div>
                </div>
                <div class="checkbox-row">
                    <input type="checkbox" name="incluir_aleatorio" id="incluir_aleatorio" value="1" checked/>
                    <label for="incluir_aleatorio" style="margin:0;font-size:.98em;color:#4c6078;">Llenar el resto aleatorio</label>
                </div>
                <button class="btn" type="submit">Generar PDF de Boletos</button>
            </form>
            <div class="preview-title">Vista previa del reintegro</div>
            <img id="preview-img" src="" alt="Reintegro"/>
            <div id="preview-file">Selecciona un reintegro</div>
            <div class="preview-note">Puedes ver el reintegro antes de imprimir.<br>Elige la figura de reintegro en el formulario.</div>
        </div>

        <!-- Planillas -->
        <div class="panel" style="background: linear-gradient(106deg,#f7fff8 86%,#ecfff3 100%);">
            <div class="panel-title">📄 Impresión de Planilla para Vendedor</div>
            <form method="post">
                <input type="hidden" name="form_type" value="planilla">
                <div class="form-row">
                    <div class="form-col" style="flex:2">
                        <label>Serie archivo:</label>
                        <select name="serie_archivo_planilla" required>
                            {% for s in series %}
                                <option>{{s}}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="form-col">
                        <label>Inicio:</label>
                        <input type="number" name="planilla_inicio" min="1" max="99999" value="1" required/>
                    </div>
                    <div class="form-col">
                        <label>Fin:</label>
                        <input type="number" name="planilla_fin" min="1" max="99999" value="40" required/>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-col">
                        <label>Vendedor:</label>
                        <input type="text" name="nombre_vendedor" maxlength="30" required placeholder="Nombre vendedor"/>
                    </div>
                    <div class="form-col">
                        <label>Fecha impresión:</label>
                        <input type="date" name="fecha_planilla" required value="{{fecha_hoy if fecha_hoy else ''}}"/>
                    </div>
                </div>
                <button class="btn green" type="submit">Imprimir Planilla</button>
            </form>
            <div class="preview-note" style="margin-top:16px;font-size:1em;">Genera la planilla de control para<br>entrega de boletos al vendedor.</div>
        </div>
    </div>
</div>
<script>
    // Vista previa reintegro
    const reintegrosPath = "/data/REINTEGROS/";
    const select = document.getElementById('reintegro_especial');
    const img = document.getElementById('preview-img');
    const fname = document.getElementById('preview-file');
    function updatePreview() {
        const val = select.value;
        if(val && val !== "" && val !== "(ninguno)") {
            img.src = reintegrosPath + val;
            img.style.display = "block";
            fname.innerText = val.replace('.png','').replace(/_/g,' ').toUpperCase();
        } else {
            img.src = "";
            img.style.display = "none";
            fname.innerText = "Selecciona un reintegro";
        }
    }
    if (select) {
        select.addEventListener('change', updatePreview);
        window.addEventListener('DOMContentLoaded', updatePreview);
    }
</script>
</body>
</html>
