<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Login - GL Studios</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css?family=Montserrat:900,700,400&display=swap" rel="stylesheet">
  <style>
    body {
      min-height: 100vh;
      margin: 0;
      font-family: 'Montserrat', Arial, sans-serif;
      background: linear-gradient(120deg, #152a48 0%, #304c80 70%, #26c6da 100%);
      overflow: hidden;
      position: relative;
    }
    .fondo-animado {
      position: fixed;
      width: 200vw;
      height: 200vh;
      left: -50vw;
      top: -50vh;
      z-index: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at 80% 30%, #3be7f899 0%, transparent 45%),
        radial-gradient(circle at 20% 70%, #0078e755 0%, transparent 60%),
        radial-gradient(circle at 70% 90%, #fff3 0%, transparent 48%);
      animation: movefondo 18s linear infinite alternate;
    }
    @keyframes movefondo {
      0% { transform: scale(1) translate(0,0);}
      100% { transform: scale(1.06) translate(-30px, 40px);}
    }
    .login-gl-container {
      position: relative;
      z-index: 1;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    .login-gl-card {
      background: rgba(255,255,255,0.19);
      box-shadow: 0 8px 38px 0 #121c2b7a, 0 1.5px 5px #26c6da55;
      backdrop-filter: blur(13px);
      -webkit-backdrop-filter: blur(13px);
      border-radius: 26px;
      padding: 42px 32px 34px 32px;
      min-width: 330px;
      max-width: 95vw;
      display: flex;
      flex-direction: column;
      align-items: center;
      border: 1.2px solid #d1e4f1cc;
      position: relative;
      animation: apcard 1.4s cubic-bezier(.23,1.05,.56,1) 0s 1;
    }
    @keyframes apcard {
      0% {transform: translateY(30px) scale(0.98); opacity: 0;}
      100% {transform: translateY(0) scale(1); opacity: 1;}
    }
    .logo-gl-float {
      position: absolute;
      top: -62px;
      left: 50%;
      transform: translateX(-50%);
      background: #fff;
      box-shadow: 0 2px 18px 0 #2196f355;
      border-radius: 50%;
      width: 96px;
      height: 96px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border: 4px solid #26c6da;
      animation: flotagl 2.8s ease-in-out infinite alternate;
    }
    .logo-gl-float img {
      width: 86px;
      height: 86px;
      object-fit: contain;
      filter: drop-shadow(0 2px 8px #26c6da44);
    }
    @keyframes flotagl {
      0% {transform: translateX(-50%) translateY(-5px);}
      100% {transform: translateX(-50%) translateY(7px);}
    }
    .titulo-login {
      color: #153057;
      font-weight: 900;
      font-size: 2.05rem;
      margin-top: 60px;
      margin-bottom: 5px;
      text-align: center;
      letter-spacing: 0.5px;
      text-shadow: 0 1.5px 0 #fff5;
    }
    .login-form {
      width: 100%;
      margin-top: 19px;
      display: flex;
      flex-direction: column;
    }
    .login-form input[type="text"], .login-form input[type="password"] {
      padding: 14px 16px;
      margin-bottom: 15px;
      border: none;
      border-radius: 12px;
      font-size: 1.13em;
      font-family: inherit;
      color: #16375e;
      background: rgba(255,255,255,0.82);
      box-shadow: 0 2px 10px #26c6da23;
      transition: box-shadow 0.22s, border 0.17s;
      outline: none;
    }
    .login-form input:focus {
      box-shadow: 0 2px 16px #0078e7aa;
      border: 1.5px solid #26c6da;
    }
    .login-form button {
      margin-top: 8px;
      padding: 13px 0;
      background: linear-gradient(90deg, #0078e7 5%, #1dd6ea 100%);
      color: #fff;
      font-weight: 900;
      font-size: 1.13em;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      box-shadow: 0 2px 13px 0 #26c6da22;
      letter-spacing: 0.5px;
      transition: background 0.21s, transform 0.13s, box-shadow 0.18s;
    }
    .login-form button:hover {
      background: linear-gradient(90deg, #0260be 0%, #3be7f8 100%);
      transform: scale(1.03);
      box-shadow: 0 2px 22px #26c6da3a;
    }
    .login-form input::placeholder {
      color: #6184b7;
      opacity: 1;
    }
    .msg-error {
      background: #ff525288;
      color: #fff;
      font-weight: 700;
      border-radius: 9px;
      padding: 10px 0;
      text-align: center;
      margin-bottom: 10px;
      margin-top: 5px;
      font-size: 1.07em;
      box-shadow: 0 2px 9px #ff525244;
      animation: apcard 1s;
    }
    @media (max-width: 430px) {
      .login-gl-card { min-width: 96vw; padding: 30px 2vw 20px 2vw;}
      .logo-gl-float { width: 70px; height: 70px; top: -40px;}
      .logo-gl-float img { width: 60px; height: 60px;}
      .titulo-login { font-size: 1.2rem; margin-top: 40px;}
    }
  </style>
</head>
<body>
  <div class="fondo-animado"></div>
  <div class="login-gl-container">
    <div class="login-gl-card">
      <div class="logo-gl-float">
        <img src="{{ url_for('static', filename='img/logo-glstudios.png') }}" alt="GL Studios Logo">
      </div>
      <div class="titulo-login">Iniciar Sesión</div>
      {% if error %}
        <div class="msg-error">{{ error }}</div>
      {% endif %}
      <form class="login-form" action="{{ url_for('login') }}" method="post" autocomplete="off">
        <input type="text" name="usuario" placeholder="Usuario" required>
        <input type="password" name="clave" placeholder="Contraseña" required>
        <button type="submit">Ingresar</button>
      </form>
    </div>
  </div>
</body>
</html>
